  <text x="88" y="25" class="hdr">DGX Spark GB10 (sm_121) — Uncut Zero-CUDA Proof &amp; Negative Controls (evidence/proof-zero-cuda-gb10/proof.cast)</text>
  <text x="24" y="76" fill="#38bdf8" font-weight="600" class="l0">$ file $BIN &amp;&amp; ldd $BIN</text>
  <text x="24" y="98" fill="#cbd5e1" class="l1">/tmp/helix-phase9-spark/out/ollm-gb10: ELF 64-bit LSB executable, ARM aarch64, version 1 (SYSV</text>
  <text x="24" y="120" fill="#e2e8f0" class="l2">	not a dynamic executable</text>
  <text x="24" y="142" fill="#38bdf8" font-weight="600" class="l3">$ cat $REPO/README.md &gt; $WORK/corpus.txt &amp;&amp; $BIN init ... &amp;&amp; $BIN gtrainb ... &amp; sleep 2 &amp;&amp; cat</text>
  <text x="24" y="164" fill="#cbd5e1" class="l4">I 15833472</text>
  <text x="24" y="186" fill="#cbd5e1" class="l5">pid=409666 alive=yes</text>
  <text x="24" y="208" fill="#34d399" font-weight="600" class="l6">cuda/cublas/libc matches in /proc/409666/maps: 0 matches (empty)</text>
  <text x="24" y="230" fill="#cbd5e1" class="l7">lr-x------ 1 drakestapleton drakestapleton 64 Nov 25 12:21 0 -&gt; /dev/null</text>
  <text x="24" y="252" fill="#cbd5e1" class="l8">l-wx------ 1 drakestapleton drakestapleton 64 Nov 25 12:21 1 -&gt; /tmp/helix-phase9-spark/proof-</text>
  <text x="24" y="274" fill="#e2e8f0" class="l9">lrwx------ 1 drakestapleton drakestapleton 64 Nov 25 12:21 3 -&gt; /dev/nvidiactl</text>
  <text x="24" y="296" fill="#e2e8f0" class="l10">lrwx------ 1 drakestapleton drakestapleton 64 Nov 25 12:21 4 -&gt; /dev/nvidia0</text>
  <text x="24" y="318" fill="#e2e8f0" class="l11">lrwx------ 1 drakestapleton drakestapleton 64 Nov 25 12:21 5 -&gt; /dev/nvidia-uvm</text>
  <text x="24" y="340" fill="#e2e8f0" class="l12">lrwx------ 1 drakestapleton drakestapleton 64 Nov 25 12:21 6 -&gt; /dev/nvidia-uvm</text>
  <text x="24" y="362" fill="#cbd5e1" class="l13">--- gtrainb output (rc=0) ---</text>
  <text x="24" y="384" fill="#e2e8f0" class="l14">T 80 3088149</text>
  <text x="24" y="406" fill="#e2e8f0" class="l15">GT 665478 69994745 118925525 112 1046137 3140316 24240 96366842 15065794960 3985044</text>
  <text x="24" y="428" fill="#38bdf8" font-weight="600" class="l16">$ Negative control 1: flip 1 bit in OLLMSP01 .sp pack -&gt; spapp must fail with rc=61</text>
